[package]
name = "yue"
version = "0.1.0"
edition = "2024"

[dependencies]

serde = { workspace = true }
serde_json = { workspace = true }

rust_decimal = { workspace = true }
log = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
tokio = { workspace = true }
sonyflake = { workspace = true }
chrono = { workspace = true }
prost = { workspace = true }
governor = { version = "0.10.0", features = ["std"] }
futures-util = "0.3.30"
moka = { version = "0.12.10", features = ["future"] }
async-trait = "0.1.81"
url = { version = "2.5.4" }
ureq = { version = "2.10", features = ["json"] }
tokio-tungstenite = { version = "0.24.0", features = ["rustls"] }
csv = "1.3.0"

[[example]]
name = "bn_exchange_info"
path = "examples/bn_exchange_info.rs"



[dev-dependencies]
mockall = "0.12.0"
wiremock = "0.6"

[build-dependencies]
prost-build = "0.12"


[features]
# -----------------------------------------------------------------------------
# -- 功能特性 (Functionality Features)
# -----------------------------------------------------------------------------

# 启用此特性将会包含所有与币安 (Binance) 相关的功能模块和依赖。
# 如果库的使用者不需要币安，他们可以不启用此特性，从而减少编译时间和依赖项。

# -----------------------------------------------------------------------------
# -- 环境配置特性 (Environment Configuration Features)
# -----------------------------------------------------------------------------

# 启用此特性将会把币安 API 的基地址切换到测试网 (Testnet)。
# 它会自动激活 `binance` 特性，因为测试网是币安功能的一部分。
binance-testnet = []
