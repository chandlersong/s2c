[package]
name = "yue"
version = "0.1.0"
edition = "2024"

[dependencies]
li = { path = "../li" }
serde = { workspace = true }
serde_json = { workspace = true }

rust_decimal = { workspace = true }
log = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
tokio = { workspace = true }
sonyflake = { workspace = true }
backon = { workspace = true }
prost = { workspace = true }
reqwest = { workspace = true }
thiserror = {workspace = true}
async-trait = { workspace = true }
governor = { version = "0.10.0", features = ["std"] }
futures-util = "0.3.30"
moka = { version = "0.12.10", features = ["future"] }

tokio-tungstenite = { version = "0.28.0", features = ["native-tls"] }
tokio-native-tls = "0.3"
csv = "1.3.0"
nonzero = "0.2.0"
url = { version = "2.5.4" }
actix = { workspace = true }
actix-rt = { workspace = true }


[dev-dependencies]
mockall = "0.13.0"
wiremock = "0.6.5"
serial_test = "3.2.0"
http = "0.2"
env_logger = "0.11"

[build-dependencies]
prost-build = "0.14.1"


[features]
# -----------------------------------------------------------------------------
# -- 功能特性 (Functionality Features)
# -----------------------------------------------------------------------------

# 启用此特性将会包含所有与币安 (Binance) 相关的功能模块和依赖。
# 如果库的使用者不需要币安，他们可以不启用此特性，从而减少编译时间和依赖项。

# -----------------------------------------------------------------------------
# -- 环境配置特性 (Environment Configuration Features)
# -----------------------------------------------------------------------------

# 启用此特性将会把币安 API 的基地址切换到测试网 (Testnet)。
# 它会自动激活 `binance` 特性，因为测试网是币安功能的一部分。
binance-testnet = []
