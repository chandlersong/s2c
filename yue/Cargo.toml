[package]
name = "yue"
version = "0.1.0"
edition = "2024"

[dependencies]
li = { path = "../li" }
serde = { workspace = true }
serde_json = { workspace = true }

rust_decimal = { workspace = true }
chrono = { workspace = true }
log = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
tokio = { workspace = true }
sonyflake = { workspace = true }
prost = { workspace = true }
reqwest = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
governor = { workspace = true }
polars = { workspace = true }  # 根据需要添加 feature

moka = { version = "0.12.10", features = ["future"] }


csv = "1.3.0"
url = { version = "2.5.4" }
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "std"] }  # pem feature 自动带上 pkcs8 和 alloc
# 如果需要 base64 解码或其他辅助
base64 = "0.22.1"
mockall = { version = "0.13.0", optional = true }

[dev-dependencies]
wiremock = "0.6.5"
serial_test = "3.2.0"

[build-dependencies]
prost-build = "0.14.1"


[features]
# -----------------------------------------------------------------------------
# -- 功能特性 (Functionality Features)
# -----------------------------------------------------------------------------

# 启用此特性将会包含所有与币安 (Binance) 相关的功能模块和依赖。
# 如果库的使用者不需要币安，他们可以不启用此特性，从而减少编译时间和依赖项。

# -----------------------------------------------------------------------------
# -- 环境配置特性 (Environment Configuration Features)
# -----------------------------------------------------------------------------

# 启用此特性将会把币安 API 的基地址切换到测试网 (Testnet)。
# 它会自动激活 `binance` 特性，因为测试网是币安功能的一部分。
binance-testnet = []

# 启用 mockable 特性将在编译时生成并导出 mock 类型（供其它 crate 在测试时使用）
mockable = ["mockall"]
