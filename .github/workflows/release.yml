name: release
on:
  workflow_dispatch:
    inputs:
      imageTag:
        description: '统一的version'
        required: true
        default: '0.1.6'
jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: yu datacenter build
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}
          file: ${{ github.workspace }}/dockerfiles/prod_with_duckdb/Dockerfile
          push: true
          tags: chandlersong/yu_datacenter:${{github.event.inputs.imageTag}}-amd64
          build-args: |
            APP_NAME=yu_datacenter
            LIBDIR=x86_64-linux-gnu
          platforms: linux/amd64
  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: yu datacenter build
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}
          file: ${{ github.workspace }}/dockerfiles/prod_with_duckdb/Dockerfile
          push: true
          tags: chandlersong/yu_datacenter:${{github.event.inputs.imageTag}}-arm64
          build-args: |
            APP_NAME=yu_datacenter
            LIBDIR=aarch64-linux-gnu
          platforms: linux/arm64
  build_manifest:
    runs-on: ubuntu-latest
    needs: [build-arm64, build-amd64]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Create and push multi-arch manifest for mingluan
        run: |
          docker buildx imagetools create --tag chandlersong/yu_datacenter:${{github.event.inputs.imageTag}} \
            chandlersong/yu_datacenter:${{github.event.inputs.imageTag}}-amd64 \
            chandlersong/yu_datacenter:${{github.event.inputs.imageTag}}-arm64
          docker buildx imagetools create --tag chandlersong/yu_datacenter:latest \
            chandlersong/yu_datacenter:${{github.event.inputs.imageTag}}-amd64 \
            chandlersong/yu_datacenter:${{github.event.inputs.imageTag}}-arm64
