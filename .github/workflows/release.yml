name: release

on:
  workflow_dispatch:
    inputs:
      imageTag:
        description: '统一的version'
        required: true
        default: '0.1.6'

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "s2c-v1"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfiles/prod_with_duckdb/Dockerfile
          push: true
          tags: chandlersong/yu_datacenter:${{ inputs.imageTag }}-amd64
          build-args: |
            APP_NAME=yu_datacenter
            LIBDIR=x86_64-linux-gnu
          platforms: linux/amd64
          cache-from: type=gha,scope=rust-amd64
          cache-to: type=gha,mode=max,scope=rust-amd64

  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "s2c-v1"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfiles/prod_with_duckdb/Dockerfile
          push: true
          tags: chandlersong/yu_datacenter:${{ inputs.imageTag }}-arm64
          build-args: |
            APP_NAME=yu_datacenter
            LIBDIR=aarch64-linux-gnu
          platforms: linux/arm64
          cache-from: type=gha,scope=rust-arm64
          cache-to: type=gha,mode=max,scope=rust-arm64

  build_manifest:
    runs-on: ubuntu-latest
    needs: [build-arm64, build-amd64]
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create --tag chandlersong/yu_datacenter:${{ inputs.imageTag }} \
            chandlersong/yu_datacenter:${{ inputs.imageTag }}-amd64 \
            chandlersong/yu_datacenter:${{ inputs.imageTag }}-arm64
          docker buildx imagetools create --tag chandlersong/yu_datacenter:latest \
            chandlersong/yu_datacenter:${{ inputs.imageTag }}-amd64 \
            chandlersong/yu_datacenter:${{ inputs.imageTag }}-arm64