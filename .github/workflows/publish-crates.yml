name: publish crates

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-crates-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: chandlersong/rust_ci:1.96-slim-bookworm
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Validate release tag and crate versions
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "Release tag must use the v<version> format, for example v0.1.0." >&2
            exit 1
          fi

          release_version="${RELEASE_TAG#v}"
          for crate in s2c-li s2c-yue s2c-yu; do
            crate_version="$(cargo pkgid "$crate" | sed 's/.*@//')"
            if [[ "$crate_version" != "$release_version" ]]; then
              echo "$crate version is $crate_version, but release tag is $RELEASE_TAG." >&2
              exit 1
            fi
          done

          echo "value=$release_version" >> "$GITHUB_OUTPUT"
      - name: Run workspace tests
        run: cargo test --all-features

  publish-s2c-li:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify packaged s2c-li
        run: cargo package --verify -p s2c-li
      - name: Publish s2c-li
        run: cargo publish --no-verify -p s2c-li
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-s2c-yue:
    needs: [validate, publish-s2c-li]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Wait for s2c-li to become available
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          for attempt in {1..30}; do
            if cargo info "s2c-li@$RELEASE_VERSION" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo "s2c-li@$RELEASE_VERSION did not become available on crates.io in time." >&2
          exit 1
      - name: Verify packaged s2c-yue
        run: cargo package --verify -p s2c-yue
      - name: Publish s2c-yue
        run: cargo publish --no-verify -p s2c-yue
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-s2c-yu:
    needs: [validate, publish-s2c-yue]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Wait for s2c-yue to become available
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          for attempt in {1..30}; do
            if cargo info "s2c-yue@$RELEASE_VERSION" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo "s2c-yue@$RELEASE_VERSION did not become available on crates.io in time." >&2
          exit 1
      - name: Verify packaged s2c-yu
        run: cargo package --verify -p s2c-yu
      - name: Publish s2c-yu
        run: cargo publish --no-verify -p s2c-yu
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
