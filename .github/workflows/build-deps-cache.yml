name: Build deps cache

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  build-deps:
    name: Build and push deps cache image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push deps-cache image
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}
          file: ${{ github.workspace }}/dockerfiles/ci_deps/Dockerfile
          push: true
          tags: chandlersong/yu_deps:buildx-cache
          platforms: linux/amd64,linux/arm64
          # optional build-args; adjust if needed
          build-args: |
            LIBDIR=x86_64-linux-gnu
          # export cache into registry so other jobs/runners can reuse it
          cache-to: type=registry,ref=chandlersong/yu_deps:buildx-cache,mode=max

      - name: Verify pushed image
        run: |
          echo "Deps cache pushed as chandlersong/yu_deps:buildx-cache"

