name: unit test

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: chandlersong/rust_ci:1.93-slim-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: |
          apt-get update
          apt-get install -y protobuf-compiler
      - name: Run cargo test
        run: cargo test --all-features