name: snapshot
on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: chandlersong/rust_ci:1.89-slim-bookworm # 替换为你的镜像
    steps:
      - uses: actions/checkout@v4
      - name: Run cargo test
        run: cargo test --all-features
