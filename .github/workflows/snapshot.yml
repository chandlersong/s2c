name: snapshot
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: chandlersong/rust_ci:1.89-slim-bookworm  # 替换为你的镜像
    steps:
      - uses: actions/checkout@v4
      - name: Run cargo test
        run: cargo test --all-features
  build-amd64:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: nightwatch build
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}
          file: ${{ github.workspace }}/Dockerfile
          push: true
          tags: chandlersong/nightwatch:snapshot-amd64
          build-args: |
            APP_NAME=nightwatch
            LIBDIR=x86_64-linux-gnu
          platforms: linux/amd64
  build-arm64:
    runs-on: ubuntu-24.04-arm
    needs: test
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: nightwatch build
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}
          file: ${{ github.workspace }}/Dockerfile
          push: true
          tags: chandlersong/nightwatch:snapshot-arm64
          build-args: |
            APP_NAME=nightwatch
            LIBDIR=aarch64-linux-gnu
          platforms: linux/arm64
  build_manifest:
    runs-on: ubuntu-latest
    needs: [test, build-arm64, build-amd64]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create and push multi-arch manifest for nightwatch
        run: |
          docker buildx imagetools create --tag chandlersong/nightwatch:snapshot \
            chandlersong/nightwatch:snapshot-amd64 \
            chandlersong/nightwatch:snapshot-arm64
