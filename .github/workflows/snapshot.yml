name: snapshot
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfiles/prod_with_duckdb/Dockerfile
          push: true
          tags: chandlersong/yu_datacenter:snapshot-amd64
          build-args: |
            APP_NAME=yu_datacenter
            LIBDIR=x86_64-linux-gnu
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfiles/prod_with_duckdb/Dockerfile
          push: true
          tags: chandlersong/yu_datacenter:snapshot-arm64
          build-args: |
            APP_NAME=yu_datacenter
            LIBDIR=aarch64-linux-gnu
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
  build_manifest:
    runs-on: ubuntu-latest
    needs: [build-arm64, build-amd64]
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create --tag chandlersong/yu_datacenter:snapshot \
            chandlersong/yu_datacenter:snapshot-amd64 \
            chandlersong/yu_datacenter:snapshot-arm64