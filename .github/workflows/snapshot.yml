name: snapshot
on:
  workflow_dispatch:
    inputs:
      app:
        description: 'app'
        required: true
        type: choice
        default: 'yu_sync_server'
        options:
          - 'yu_sync_server'
          - 'yu_sync_client'
          - 'yu_datacenter'
jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.1.0
      - name: Inject GitHub Cache Env
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./dockerfiles/prod_with_duckdb/Dockerfile
          push: true
          tags: chandlersong/${{ inputs.app }}:snapshot-amd64
          build-args: |
            APP_NAME=${{ inputs.app }}
            LIBDIR=x86_64-linux-gnu
            SCCACHE_GHA_ENABLED: "true"
          platforms: linux/amd64
          cache-from: type=gha,scope=s2cDockerAmd64
          cache-to: type=gha,mode=max,scope=s2cDockerAmd64
  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.1.0
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      # 注入 GitHub Actions Cache 所需的环境变量
      - name: Inject GitHub Cache Env
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./dockerfiles/prod_with_duckdb/Dockerfile
          push: true
          tags: chandlersong/${{ inputs.app }}:snapshot-arm64
          build-args: |
            APP_NAME=${{ inputs.app }}
            LIBDIR=aarch64-linux-gnu
            SCCACHE_GHA_ENABLED: "true"
          platforms: linux/arm64
          cache-from: type=gha,scope=s2cDockerArm64
          cache-to: type=gha,mode=max,scope=s2cDockerArm64
  build_manifest:
    runs-on: ubuntu-latest
    needs: [ build-arm64, build-amd64 ]
    steps:
      - uses: docker/setup-buildx-action@v4.1.0
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create --tag chandlersong/${{ inputs.app }}:snapshot \
            chandlersong/${{ inputs.app }}:snapshot-amd64 \
            chandlersong/${{ inputs.app }}:snapshot-arm64