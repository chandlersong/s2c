name: snapshot
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Cache cargo registry and git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-
      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: |
            target
            target/**
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: yu datacenter build
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}
          file: ${{ github.workspace }}/dockerfiles/prod_with_duckdb/Dockerfile
          push: true
          tags: chandlersong/yu_datacenter:snapshot-amd64
          build-args: |
            APP_NAME=yu_datacenter
            LIBDIR=x86_64-linux-gnu
          build-args: |
            APP_NAME=yu_datacenter
            LIBDIR=x86_64-linux-gnu
            BUILDKIT_INLINE_CACHE=1
          platforms: linux/amd64
          cache-from: type=registry,ref=chandlersong/yu_datacenter:buildx-cache
          cache-to: type=registry,ref=chandlersong/yu_datacenter:buildx-cache,mode=max
  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: yu datacenter build
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}
          file: ${{ github.workspace }}/dockerfiles/prod_with_duckdb/Dockerfile
          push: true
          tags: chandlersong/yu_datacenter:snapshot-arm64
          build-args: |
            APP_NAME=yu_datacenter
            LIBDIR=aarch64-linux-gnu
            BUILDKIT_INLINE_CACHE=1
          platforms: linux/arm64
          cache-from: type=registry,ref=chandlersong/yu_datacenter:buildx-cache
          cache-to: type=registry,ref=chandlersong/yu_datacenter:buildx-cache,mode=max
  build_manifest:
    runs-on: ubuntu-latest
    needs: [build-arm64, build-amd64]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Create and push multi-arch manifest for yu_datacenter
        run: |
          docker buildx imagetools create --tag chandlersong/yu_datacenter:snapshot \
            chandlersong/yu_datacenter:snapshot-amd64 \
            chandlersong/yu_datacenter:snapshot-arm64
