name: snapshot
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Inject GitHub Cache Env
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfiles/prod_with_duckdb/Dockerfile
          push: true
          tags: chandlersong/yu_datacenter:snapshot-amd64
          build-args: |
            APP_NAME=yu_datacenter
            LIBDIR=x86_64-linux-gnu
            SCCACHE_GHA_ENABLED: "true"
          platforms: linux/amd64
          cache-from: type=gha,scope=s2c_docker_amd64
          cache-to: type=gha,mode=max,scope=s2c_docker_amd64
  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      # 注入 GitHub Actions Cache 所需的环境变量
      - name: Inject GitHub Cache Env
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfiles/prod_with_duckdb/Dockerfile
          push: true
          tags: chandlersong/yu_datacenter:snapshot-arm64
          build-args: |
            APP_NAME=yu_datacenter
            LIBDIR=aarch64-linux-gnu
            SCCACHE_GHA_ENABLED: "true"
          platforms: linux/arm64,scope=s2c_docker_arm64
          cache-from: type=gha,scope=s2c_docker_arm64
          cache-to: type=gha,mode=max
  build_manifest:
    runs-on: ubuntu-latest
    needs: [ build-arm64, build-amd64 ]
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create --tag chandlersong/yu_datacenter:snapshot \
            chandlersong/yu_datacenter:snapshot-amd64 \
            chandlersong/yu_datacenter:snapshot-arm64