name: snapshot
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Cache Rust dependencies
        id: cache-rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: mingluan build
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}
          file: ${{ github.workspace }}/dockerfiles/prod_with_duckdb/Dockerfile
          push: true
          tags: chandlersong/mingluan:snapshot-amd64
          build-args: |
            APP_NAME=mingluan
            LIBDIR=x86_64-linux-gnu
          platforms: linux/amd64
  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Cache Rust dependencies
        id: cache-rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: mingluan build
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}
          file: ${{ github.workspace }}/dockerfiles/prod_with_duckdb/Dockerfile
          push: true
          tags: chandlersong/mingluan:snapshot-arm64
          build-args: |
            APP_NAME=mingluan
            LIBDIR=aarch64-linux-gnu
          platforms: linux/arm64
  build_manifest:
    runs-on: ubuntu-latest
    needs: [build-arm64, build-amd64]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Create and push multi-arch manifest for mingluan
        run: |
          docker buildx imagetools create --tag chandlersong/mingluan:snapshot \
            chandlersong/mingluan:snapshot-amd64 \
            chandlersong/mingluan:snapshot-arm64
