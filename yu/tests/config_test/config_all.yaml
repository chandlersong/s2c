proxyUrl: "http://localhost:7891"
logLevel: "info"
data_retention_hours: 99
data_integrity:
  startup_check_timeout_ms: 3600000
  periodic_check_interval_cron: "*/10 * * * * * *"
  repair_backoff:
    max_retries: 10
database:
  path: "test.db"
binance:
  accounts:
    - account_name: "account1"
      api_key: "test_api_key_1"
      value: "test_secret_key_1"
      secret_type: "HMAC"
      account_type: "BinanceNormal"
    - account_name: "account2"
      api_key: "test_api_key_2"
      value: "test_secret_key_2"
      secret_type: "Ed25519"
      account_type: "BinancePortfolio"
  spot_stream:
    trade:
      enabled: true
      symbols:
        - BTCUSDT
        - ETHUSDT
        - BNBUSDT
      batch_size: 100
      flush_interval_ms: 5000
      retention_days: 7
    depth:
      enabled: true
      symbols:
        - BTCUSDT
        - ETHUSDT
        - BNBUSDT
      update_speed: "100ms"
      levels: 20


