proxyUrl: "http://localhost:7891"
logLevel: "info"
database:
  path: "test.db"
binance_websocket:
  spot:
    accounts:
      - account_name: "account1"
        api_key: "test_api_key_1"
        key_path: "test_secret_key_1"
      - account_name: "account2"
        api_key: "test_api_key_2"
        key_path: "test_secret_key_2"
  spot_stream:
    trade:
      enabled: true
      symbols:
        - BTCUSDT
        - ETHUSDT
        - BNBUSDT
      batch_size: 100
      flush_interval_ms: 5000
      retention_days: 7
    depth:
      enabled: true
      symbols:
        - BTCUSDT
        - ETHUSDT
        - BNBUSDT
      update_speed: "100ms"
      levels: 20


