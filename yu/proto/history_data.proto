syntax = "proto3";
package grpc_sync;

/*

# 规则
1. 数据分为Instrument和History两个


# 思考过程
1. 交易所。也就是Exchange暂时定位一个属性来维护。而不是具体的实体。因为在数据处理上面，交易所其实意义不大。Instrument就可以做区分。
  - 简化流程，你知道instrument的时候，也就知道了exchange。没有必要变成一个实体。

*/



enum InstrumentType{
  EXCHANGE_UNSPECIFIED = 0;
  POLYMARKET = 1;
  OKX = 2;
  BINANCE = 3;
}


enum HistoryType {
  Instrument_UNSPECIFIED = 0;
  POLYMARKET_TOKEN = 1;
  OKX_KLINE = 2;
  OKX_OPTION_SUMMARY = 3;
  BINANCE_SPOT = 4;
  BINANCE_TRADE = 5;
  BINANCE_SWAP = 6;
  BINANCE_SWAP_TRADE = 7;
  BINANCE_SWAP_FUNDING_RATE = 8;
}

message PolymarketInstrument{
  uint64 server_id = 1;
  string series_id = 2;
  string series_slug = 3;
  string event_id = 4;
  string event_slug = 5;
  string market_id = 6;
  string market_slug = 7;
  string asset_id = 8;
  string asset_slug = 9;
  uint64 start_ms = 10;
  uint64 end_ms = 11;
  uint64 latest_timestamp = 12;
}

message OkxInstrument{
  uint64 server_id = 1;
  string inst_id = 2;
  string inst_type = 3;
  string inst_family = 4;
  string base_ccy = 5;
  string quote_ccy = 6;
  string settle_ccy = 7;
  uint64 list_time = 8;
  uint64 exp_time = 9;
  double tick_sz = 10;
  double lot_sz = 11;
  double min_sz = 12;
  string alias = 13;
  string state = 14;
  string inst_id_code = 15;
  string inst_category = 16;
}

message BinanceInstrument {
  uint64 server_id = 1;
  string symbol = 2;
  string status = 3;
  string base_asset = 4;
  string quote_asset = 5;
  int32 quote_asset_precision = 6;
  repeated string order_types = 7;
  string symbol_type = 8;
  optional uint64 on_board_time = 9;
}

message Instrument {
  InstrumentType instrument_type = 1;
  oneof payload {
    PolymarketInstrument polymarket = 2;     // polymarket资产
    OkxInstrument okx = 3;     // okx资产
    BinanceInstrument binance = 4;
  }

}

message InstrumentList{
  repeated Instrument instruments = 1;
  uint64 server_timestamp = 2;  //服务器的时间戳
}
/**
服务器端和客户端同步的服务
这里要提供3个服务
1. 获取服务器里面的所有资产的列表
2. client提供asset id和timestamp。然后server把timestamp之后的所有数据推送给client。stream里面推送，PolyMarketHistoryList
3. 推送信息给client端最新的消息。 PolyMarketHistoryList

# 同步

##  同步Instrument
这里应该是单纯的Instrument信息。不包含关于其他的。因为在实际过程中，一个Instrument可能会包含很多信息。比如Okx的option包含了kline和summary

##  SyncHistory
同步历史消息。时间范围应该在于，本地时间到最新时间上个时间的返回时间戳server_timestamp

*/
service SyncInterface {

  // 1. 获取服务器里面的所有资产列表
  rpc ListInstrument(Empty) returns (InstrumentList) {}

  // 2. client提供asset id和timestamp，server把timestamp之后的所有数据推送给client
  rpc SyncHistory(SyncRequest) returns (stream ServerMessage) {}

  // 3. 推送信息给client端最新的消息
  rpc SubscribeLatest(SubscribeRequest) returns (stream ServerMessage) {}
}

message ServerMessage {
  repeated HistoryEntry history = 1;
  uint64 server_timestamp = 2;  //服务器的时间戳

}

message HistoryEntry{
  HistoryType history_type = 1;
  InstrumentType instrument_type = 2;
  uint64 inst_id = 3;   // 资产ID
  oneof payload {
    PolyMarketHistory polymarket_history = 4;
    OkxKline okx_kline = 5;
    OkxOptionSummary okx_option_summary = 6;
    BinanceKline binance_kline = 7;
    BinanceTrade binance_trade = 8;
    BinanceFundingRate binance_funding_rate = 9;
  }
}


// 空消息
message Empty {}

// 历史数据同步请求
message SyncRequest {
  uint64 inst_id = 1;   // 资产ID
  uint64 start_ms = 2;  // 起始时间戳，server推送该时间之后的所有数据
  uint64 end_ms = 3;    // 结束时间戳，server推送该时间之前的所有数据
  HistoryType history_type = 4; // 交易品类类型
}

// 订阅最新消息请求
message SubscribeRequest {
  uint64 client_id = 1; //用户表示自己的身份，方便server端区分不同的client，有client端自己定义
}

message PolyMarketHistory {
  uint64 timestamp = 2;
  double price = 3;
}

message OkxKline {
  uint64 id = 1;
  uint64 ts = 3;
  double open = 4;
  double high = 5;
  double low = 6;
  double close = 7;
  double vol = 8;
  double vol_ccy = 9;
  double vol_ccy_quote = 10;
  uint32 confirm = 11;
}


message OkxOptionSummary {
  uint64 id = 1;
  string inst_identify = 3;
  string inst_type = 4;
  string uly = 5;
  uint64 acquire_ts = 6;
  uint64 server_ts = 7;
  optional double ask_vol = 8;
  optional double bid_vol = 9;
  optional double delta = 10;
  optional double delta_bs = 11;
  optional double fwd_px = 12;
  optional double gamma = 13;
  optional double gamma_bs = 14;
  optional double lever = 15;
  optional double mark_vol = 16;
  optional double real_vol = 17;
  optional double vol_lv = 18;
  optional double theta = 19;
  optional double theta_bs = 20;
  optional double vega = 21;
  optional double vega_bs = 22;
}

message BinanceKline {
  uint64 id = 1;
  uint64 candle_begin_time = 3;
  double open = 4;
  double high = 5;
  double low = 6;
  double close = 7;
  double volume = 8;
  double quote_volume = 9;
  uint64 number_of_trades = 10;
  double taker_buy_base_asset_volume = 11;
  double taker_buy_quote_asset_volume = 12;
  uint64 close_time = 13;
  uint32 interval = 14;
  optional int64 first_trade_id = 15;
  optional int64 last_trade_id = 16;
}

message BinanceTrade {
  uint64 id = 1;
  int64 event_time = 2;
  int64 trade_id = 4;
  double price = 5;
  double qty = 6;
  optional int64 trade_time = 7;
  optional bool is_buyer_maker = 8;
  int64 created_at = 9;
}

message BinanceFundingRate {
  uint64 id = 1;
  uint64 funding_time = 2;
  double funding_rate = 3;
  optional double mark_price = 4;
}
