[workspace]
resolver = "2"



members = [
    "yue",
    "li",
    "yu",
]


[workspace.dependencies]
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.122"
tokio = { version = "1", features = ["full"] }
sha2 = { version = "0.10.6", default-features = false, features = ["oid"] }

hmac = "0.12.0"
rust_decimal = { version = "1.39", features = ["macros"] }
async-trait = "0.1.81"
log = "0.4"
fern = "0.7.1"
humantime = "2.1.0"
sonyflake = "0.4.0"
chrono = "0.4.39"
rocksdb = "0.23.0"
prost = "0.14.1"
prost-build = "0.12"
backon = "1.5.2"
duckdb = { version = "=1.3.2", features = ["r2d2"] }
thiserror = "2.0.16"
rs-snowflake = "0.6.0"
config = { version = "0.15.16", features = ["yaml"] }
actix = "0.13.5"
actix-rt = "2.11.0"
tokio-tungstenite = { version = "0.28.0", features = ["native-tls"] }
tokio-native-tls = "0.3"
futures-util = "0.3.30"
tonic = { version = "0.12.3", default-features = false, features = ["transport", "codegen", "prost", "router"] }

### DEV ####
mockall = { version = "0.13.1" }

# Arrow ecosystem - align versions workspace-wide to avoid multiple-arrow-version
# type mismatches (e.g. duckdb or other crates pulling different arrow versions).
arrow = { version = "55.2.0" , features = ["prettyprint"] }
arrow-array = { version = "55.2.0", features = ['flight-sql'] }
arrow-buffer = { version = "55.2.0" }
arrow-data = { version = "55.2.0" }
arrow-ipc = { version = "55.2.0" }
arrow-schema = { version = "55.2.0" }
arrow-flight = { version = "55.2.0" }

# 网络库
reqwest = { version = "0.12.23", features = ["json", "rustls-tls"] }
reqwest-retry = "0.5"
reqwest-middleware = "0.3"      # 提供 ExponentialBackoff