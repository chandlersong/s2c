[workspace]
resolver = "2"



members = [
    "yue",
     "li",
]


[workspace.dependencies]
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.122"
tokio = { version = "1", features = ["full"] }
sha2 = { version = "0.10.6", default-features = false, features = ["oid"] }
hmac = "0.12.0"
rust_decimal = "1.35"
async-trait = "0.1.81"
log = "0.4"
fern = "0.6"
humantime = "2.1.0"
sonyflake = "0.1"
chrono = "0.4.39"
rocksdb = "0.23.0"
prost = "0.12"
prost-build = "0.12"

### DEV ####
mockall = "0.13.0"


