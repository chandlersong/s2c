[package]
name = "braavos"
version = "0.1.0"
edition = "2024"

[dependencies]
maester = { path = "../maester" }

serde = { workspace = true }
serde_json = { workspace = true }

rust_decimal = { workspace = true }
log = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
tokio = { workspace = true }
sonyflake = { workspace = true }
chrono = { workspace = true }
prost = { workspace = true }
governor = { version = "0.10.0", features = ["std"] }
tokio-tungstenite = { version = "0.24.0", features = ["rustls"] }
futures-util = "0.3.30"
moka = { version = "0.12.10", features = ["future"] }
async-trait = "0.1.81"
ureq = { version = "2.10", features = ["json"] }
url = "2.5.4"

[dev-dependencies]
mockall = "0.12.0"
wiremock = "0.6"

[build-dependencies]
prost-build = "0.12"


